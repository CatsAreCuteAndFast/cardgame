<!DOCTYPE html><html><head><meta charset="utf-8"><title>Tile outline reference</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1d1a24;font-family:sans-serif;color:#a9a4bb;--c:#ffffff;--idle:2.8s}
.grid{display:grid;grid-template-columns:repeat(3,110px);gap:26px}
.tile{position:relative;width:110px;height:110px}
.tile img{width:110px;height:110px;display:block}
.tile svg{position:absolute;left:-8px;top:-8px;overflow:visible;pointer-events:none;transform-origin:50% 50%}
.valid{cursor:pointer}
.valid svg rect{stroke:var(--c);stroke-width:3;stroke-opacity:.75;stroke-dasharray:12 9;animation:ants var(--idle) linear infinite}
.valid.target svg{animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;filter:drop-shadow(0 0 7px var(--c))}
.valid.target svg rect{stroke-width:5;stroke-opacity:1;animation:lock .3s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes ants{to{stroke-dashoffset:-42}}
@keyframes pop{from{transform:scale(1.18);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes lock{from{stroke-dasharray:12 9}to{stroke-dasharray:21 0}}
p{margin-top:40px;text-align:center}
</style></head><body><div><div class="grid" id="g"></div><p>Outlined tiles are valid. Hover one to target it.</p></div>
<script>
const valid=[1,3,4,5,7],g=document.getElementById('g');
for(let i=0;i<9;i++){const d=document.createElement('div');d.className='tile';d.innerHTML='<img src="../tiles/ember-orange/grain-up.svg">';
if(valid.includes(i)){d.classList.add('valid');d.insertAdjacentHTML('beforeend','<svg width="126" height="126" viewBox="0 0 126 126"><rect x="1.5" y="1.5" width="123" height="123" rx="21" fill="none" pathLength="420"/></svg>');
d.onmouseenter=()=>d.classList.add('target');d.onmouseleave=()=>d.classList.remove('target');}
g.appendChild(d);}
</script></body></html>
