<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<clipPath id="face"><rect x="0" y="0" width="160" height="144" rx="20"></rect></clipPath>
<filter id="grain" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse" filterRes="160"><feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" seed="4"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
<filter id="blur"><feGaussianBlur stdDeviation="9"></feGaussianBlur></filter>
<radialGradient id="rad" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".18"></stop><stop offset="1" stop-color="#000" stop-opacity=".14"></stop></radialGradient>
<linearGradient id="lin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"></stop><stop offset=".55" stop-color="#fff" stop-opacity="0"></stop></linearGradient>
<pattern id="stripes" width="29" height="29" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14.5" height="29" fill="#fff" fill-opacity=".14"></rect></pattern>
</defs><rect x="0" y="0" width="160" height="160" rx="20" fill="#221b28"></rect><g clip-path="url(#face)" style="isolation:isolate"><rect x="0" y="0" width="160" height="144" fill="#4f4560"></rect><rect x="0" y="0" width="160" height="144" fill="url(#stripes)" opacity="0.5"></rect><rect x="0" y="0" width="160" height="144" fill="url(#lin)"></rect><rect x="0" y="0" width="160" height="4" fill="#fff" fill-opacity=".18"></rect></g></svg>