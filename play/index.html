<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<title>Card Game Testing</title>
<link rel="stylesheet" href="../editor/editor.css">
<link rel="stylesheet" href="play.css">
<link rel="stylesheet" href="tune.css">
</head>
<body>
<header class="top">
  <nav class="tabs" role="tablist">
    <button class="tab" data-tab="levels">Levels</button>
    <button class="tab" data-tab="play">Play</button>
  </nav>
  <div class="current"><span id="current-name"></span><button id="reload" class="reload">↻ Reload</button></div>
</header>

<main>
  <section id="levels" class="screen">
    <p id="pack-error" class="validation bad" hidden></p>
    <div id="level-list"></div>
  </section>

  <section id="play" class="screen">
    <p id="play-empty" class="empty" hidden>Pick a level on the Levels tab.</p>
    <div class="row status">
      <span id="play-status"></span>
      <span class="play-buttons">
        <button id="play-undo" aria-label="Undo">↶ Undo</button>
        <button id="play-redo" aria-label="Redo">↷ Redo</button>
        <button id="play-reset">Reset</button>
      </span>
    </div>
    <div id="play-error" class="validation bad" hidden></div>
    <div class="board-area"><div class="board" id="play-board"></div></div>
    <div class="row prompt">
      <span id="play-prompt"></span>
      <button id="play-cancel" class="small" hidden>Cancel</button>
      <button id="play-next" class="primary" hidden>Next level →</button>
    </div>
    <div class="hand" id="play-hand"></div>
  </section>
</main>

<div class="loading" id="loading">Loading…</div>

<script src="../editor/reload.js"></script>
<script type="module" src="play.js"></script>
<script type="module" src="tune.js"></script>
</body>
</html>
